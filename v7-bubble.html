<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astrid · v7 bubble (WebGL, archived)</title>
<style>
  :root{--paper:#e9e9eb;--ink:#4a5568}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
  body{display:grid;place-items:center;font:500 12px/1 -apple-system,"Instrument Sans",system-ui,sans-serif;color:var(--ink)}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}
  .stage{position:relative;width:min(84vmin,620px);aspect-ratio:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .coats{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:10px;align-items:center}
  .coats button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0;outline-offset:3px}
  .coats button[aria-pressed=true]{outline:1.5px solid var(--ink)}
  .coats .mode{width:auto;height:22px;border-radius:11px;padding:0 10px;background:transparent;color:var(--ink);font:inherit;border-color:currentColor;opacity:.7}
  /* debug panel (?debug or press d) */
  #dbg{position:fixed;top:12px;right:12px;width:236px;padding:10px 12px 12px;border-radius:12px;background:rgba(18,20,28,.82);color:#e8ecf4;
       font:500 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  #dbg.on{display:block}
  #dbg h4{margin:0 0 8px;font-size:11px;display:flex;justify-content:space-between;letter-spacing:.04em}
  #dbg h4 b{color:#8fe3ff;font-weight:600}
  #dbg label{display:grid;grid-template-columns:1fr 44px;gap:2px 6px;margin:5px 0}
  #dbg label span:last-of-type{text-align:right;color:#c4a6ff}
  #dbg input{grid-column:1 / 3;width:100%;margin:0;accent-color:#ff9fe0;height:14px}
  #dbg .row{display:flex;gap:6px;margin-top:9px}
  #dbg button{flex:1;font:inherit;color:#e8ecf4;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:5px 0;cursor:pointer}
  #dbg button:hover{background:rgba(255,255,255,.18)}
  #nogl{position:fixed;inset:0;display:none;place-items:center}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="stage" id="astrid" aria-label="Astrid"></div>
<div class="coats" id="coats"></div>
<div id="dbg"></div>

<!-- Glass shader: inlined copy of glass.frag (run `python3 build.py` after editing glass.frag). -->
<script type="x-shader/x-fragment" id="glass-frag">
// Astrid glass — one fullscreen fragment pass, one draw call per frame. GLSL ES 1.00 (WebGL1/2).
// Units: AstridFace 240-space. Orb r118 at (120,120); view framing -50..290 (340 units across the stage).
// Layering (bottom → top):
//   base(p)    : paper · contact shadow · halo · frosted shell (evaluated once)
//   interior(p): inner-rim iridescence · drifting blob field (deep pool, core, bloom) · Fresnel ·
//                eyes (glow + glossy fill) — clipped to the orb and sampled 3× (R/G/B) at slightly
//                different radii → real refraction fringe, ~0 at the centre, growing ∝ r² to the rim.
//   room light: sheen · crisp thin-film iridescent rim · inner white line · glint (never refracted,
//               never moves with gaze).
// Port note (Metal): uniforms map 1:1 to a constant buffer; base()/interior() → plain functions; no textures.
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec3  uView;    // centre x,y (drawing-buffer px, GL origin bottom-left), units per px
uniform vec3  uPaper, uCore, uDeep, uMid, uEdge, uHalo, uEye, uEyeHi, uEyeLo, uGlow, uShadow;
uniform vec2  uMode;    // x: inner line opacity, y: dark (0/1)
uniform vec4  uRot;     // eyes: cos yaw, sin yaw, cos pitch, sin pitch
uniform vec4  uEyeP;    // eyes: stadium half-width (rad), cap half-length (rad), lidFade, reject radius (units)
uniform vec4  uEyeC;    // eyes: projected screen centres (L.xy, R.xy) — cheap bounding reject only
uniform vec4  uCoreM;   // glass head-turn: offset xy (units, inverted to gaze), foreshorten scale xy
uniform mat2  uMA, uMB, uMC; // blob drift (core, pool, bloom): inverse of CSS rotate·scale (precomputed in JS)
uniform vec2  uTA, uTB, uTC; // blob drift: drift origin (120,144.8) + translate (units)
uniform float uNT;      // noise time (advanced by JS × drift speed)
uniform vec4  uTune1;   // refraction, rim thickness (×1.5u), rim intensity, frost softness
uniform vec4  uTune2;   // eye softness, glint, noise warp (units), -

const vec2  C  = vec2(120.0, 120.0);
const float R  = 118.0;   // orb
const float RR = 110.0;   // eye sphere (AstridFace projector)

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
vec2 rot2(vec2 v, float a){ float c = cos(a), s = sin(a); return vec2(c*v.x - s*v.y, s*v.x + c*v.y); }
// "blurred linear ramp": 1 at d=0 → 0 at d=1, softened by k at both ends
float lin(float d, float k){ return 1.0 - smoothstep(-k, 1.0 + k, d); }

// inverse of CSS `translate(t) rotate(r) scale(s)` about the drift origin O (same as v6 .drift):
//   q_local = M⁻¹ (q − O − t) + O, with M⁻¹ and O+t precomputed per blob in JS (no trig per pixel)
const vec2 DO = vec2(120.0, 144.8);
vec2 undrift(vec2 q, mat2 m, vec2 ot){ return m * (q - ot) + DO; }

// iridescent thin-film ramp, cyclic: cyan → lavender → pink → peach → cyan
vec3 iri(float t){
  t = fract(t);
  vec3 c0 = vec3(0.561, 0.890, 1.000), c1 = vec3(0.769, 0.651, 1.000),
       c2 = vec3(1.000, 0.624, 0.878), c3 = vec3(1.000, 0.824, 0.651);
  if (t < 0.28) return mix(c0, c1, smoothstep(0.0, 0.28, t));
  if (t < 0.50) return mix(c1, c2, smoothstep(0.28, 0.50, t));
  if (t < 0.75) return mix(c2, c3, smoothstep(0.50, 0.75, t));
  return mix(c3, c0, smoothstep(0.75, 1.0, t));
}

// eyes: screen → sphere (r=RR) → undo yaw, pitch → lon/lat → analytic stadium (AstridFace.eyePath)
vec3 eyes(vec3 col, vec2 p){
  vec2 el = p - uEyeC.xy, er = p - uEyeC.zw;
  if (min(dot(el, el), dot(er, er)) > uEyeP.w * uEyeP.w) return col;   // far from both eyes
  vec2 s = (p - C) / RR; s.y = -s.y;
  float rr = dot(s, s);
  if (rr >= 1.0 || uEyeP.z <= 0.0) return col;
  float Z  = sqrt(1.0 - rr);
  float x  = s.x*uRot.x - Z*uRot.y;
  float z1 = s.x*uRot.y + Z*uRot.x;
  float y  = s.y*uRot.z + z1*uRot.w;
  float z  = -s.y*uRot.w + z1*uRot.z;
  float lon = atan(x, z), lat = asin(clamp(y, -1.0, 1.0));
  float u = lon - (lon < 0.0 ? -0.2 : 0.2), v = lat - 0.04;
  float hw = uEyeP.x, cap = uEyeP.y;
  float d  = length(vec2(u, v - clamp(v, -cap, cap))) - hw;   // radians
  float ds = d * RR * mix(Z, 1.0, 0.5);                       // ≈ screen units (foreshortened)
  float w  = 1.1 * uTune2.x + 0.3;
  float vis = uEyeP.z * smoothstep(0.02, 0.08, Z);            // lidFade · z>0.02 cull
  float glow = 0.36 * (1.0 - smoothstep(-1.0, 4.0 + 2.0*w, ds));
  col = mix(col, uGlow, glow * vis);
  // glossy fill: eyeHi → eye → eyeLo along (0.35, 1) in the stadium's own frame
  float uu = clamp(u / max(hw, 1e-4) * 0.5 + 0.5, 0.0, 1.0);
  float vv = clamp(0.5 - v / (2.0 * (cap + hw) + 1e-4), 0.0, 1.0);
  float t  = clamp((0.35*uu + vv) / 1.1225, 0.0, 1.0);
  vec3 ec  = t < 0.55 ? mix(uEyeHi, uEye, t / 0.55) : mix(uEye, uEyeLo, (t - 0.55) / 0.45);
  float fill = 1.0 - smoothstep(-w, w, ds);
  return mix(col, ec, fill * vis);
}

// outer layer (not refracted): paper · contact shadow · halo · frosted shell
vec3 base(vec2 p, float r){
  vec3 col = uPaper;
  // contact shadow: she sits on the page
  vec2 sd = (p - vec2(120.0, 252.0)) / vec2(88.0, 13.0);
  col = mix(col, uShadow, 0.16 * exp(-dot(sd, sd) * 2.6));
  // halo (trimmed)
  col = mix(col, uHalo, 0.75 * (1.0 - smoothstep(112.0, 146.0, r)));
  // frosted shell: radial mid → edge (static, centred low like v6 #body)
  float bt = length(p - vec2(120.0, 146.0)) / 128.0;
  vec3 m2 = mix(uMid, uEdge, 0.6);
  vec3 body = bt < 0.55 ? uMid : (bt < 0.76 ? mix(uMid, m2, (bt - 0.55) / 0.21)
                                            : mix(m2, uEdge, clamp((bt - 0.76) / 0.17, 0.0, 1.0)));
  float bw = 9.0 * uTune1.w + 0.5;
  return mix(col, body, 1.0 - smoothstep(R - bw, R + bw, r));
}

// inner-rim iridescence (sharp-ish band → refracted per channel)
vec3 rimIri(vec3 col, vec2 p){
  float r = length(p - C), rn = r / R;
  float ia = rn < 0.8 ? 0.0 : (rn < 0.9 ? 0.22 * (rn - 0.8) / 0.1 : mix(0.22, 0.2, clamp((rn - 0.9) / 0.1, 0.0, 1.0)));
  ia *= 1.3 * (1.0 - smoothstep(R - 0.8, R + 0.8, r));
  float diag = ((p.x - 20.0) + (p.y - 20.0)) / 400.0;
  vec3 pk = vec3(1.0, 0.624, 0.878), lv = vec3(0.769, 0.651, 1.0), cy = vec3(0.624, 0.902, 1.0);
  vec3 ir = rn < 0.95 ? mix(pk, lv, clamp((rn - 0.9) / 0.05, 0.0, 1.0)) : mix(lv, cy, clamp((rn - 0.95) / 0.05, 0.0, 1.0));
  vec3 ic = mix(ir, iri(diag + 0.1), 0.35);                   // v6 rimGlow ramp + a little position hue
  vec3 icMix = mix(col, ic, ia);                              // light paper: tint
  vec3 icScr = 1.0 - (1.0 - col) * (1.0 - ic * ia * 1.4);     // dark paper: screen (glow, not mud)
  return mix(icMix, icScr, uMode.y);
}

// blob field + Fresnel (soft, ≥8u features)
vec3 blobs(vec3 col, vec2 p, vec2 warp){
  float r = length(p - C), rn = min(r / R, 1.0);
  float clip = 1.0 - smoothstep(R - 0.8, R + 0.8, r);
  float k = uTune1.w * 0.035 + 0.005;
  // head-turn (inverted, foreshortened) → noise warp → per-blob random-target drift
  vec2 q = (p - C - uCoreM.xy) / uCoreM.zw + C + warp;
  vec2 qb = undrift(q, uMB, uTB);                            // deep pool (bottom)
  float aB = 0.6 * lin(length(qb - vec2(120.0, 214.0)) / 110.9, k * 2.0);
  col = mix(col, uDeep, aB * clip);
  vec2 qa = undrift(q, uMA, uTA);                            // main core
  float dA = length(qa - vec2(120.0, 146.0)) / 127.44;
  vec3 c1 = mix(uCore, uMid, 0.4);
  vec3 ca = dA < 0.3 ? mix(uCore, c1, dA / 0.3) : mix(c1, uMid, clamp((dA - 0.3) / 0.2, 0.0, 1.0));
  float aA = (dA < 0.3 ? 1.0 : (dA < 0.5 ? mix(1.0, 0.6, (dA - 0.3) / 0.2) : 0.6))
           * (1.0 - smoothstep(0.5 - k*2.0, 0.62 + k*2.0, dA));
  col = mix(col, ca, aA * clip);
  vec2 qc = undrift(q, uMC, uTC);                            // lighter bloom
  float aC = 0.75 * lin(length((qc - vec2(91.7, 120.0)) / vec2(70.8, 56.6)), k * 3.0);
  col = mix(col, mix(uCore, uMid, 0.6), aC * clip);
  // Fresnel edge brightening
  float fz = sqrt(max(0.0, 1.0 - rn*rn));
  float fz1 = 1.0 - fz, fres = fz1 * fz1 * fz1;
  return mix(col, mix(uEdge, vec3(1.0), mix(0.55, 0.1, uMode.y)), fres * mix(0.35, 0.5, uMode.y) * clip);
}

// interior, full order (rim iridescence · blobs · Fresnel · eyes) — used by CHROMA_FULL
vec3 interior(vec3 col, vec2 p, vec2 warp){ return eyes(blobs(rimIri(col, p), p, warp), p); }

void main(){
  vec2 f = gl_FragCoord.xy;
  vec2 p = C + vec2(f.x - uView.x, uView.y - f.y) * uView.z;
  vec2 d = p - C; float r = length(d);
  vec3 col;

  if (r < 150.0) {
    // noise warp computed once per pixel (shared by the 3 chroma taps)
    vec2 np = p * 0.018;
    vec2 warp = vec2(vnoise(np + vec2(uNT*0.11, uNT*0.05)) + 0.5*vnoise(np*2.1 + vec2(-uNT*0.07, uNT*0.09) + 3.7),
                     vnoise(np + vec2(7.1 - uNT*0.06, 2.3 + uNT*0.10)) + 0.5*vnoise(np*2.1 + vec2(uNT*0.08, -uNT*0.06) + 9.2)) - 0.75;
    warp *= uTune2.z;
    // chromatic refraction: R/G/B at different radii — 0 at centre, ∝ r² toward the rim
    float rn = min(r / R, 1.0);
    vec2 dir = r > 1e-3 ? d / r : vec2(0.0);
    vec2 off = (dir * (0.45 + 6.5*rn*rn) + vec2(0.55, -0.18)) * uTune1.x * mix(1.0, 0.6, uMode.y);
    vec3 b = base(p, r);
    vec3 ii;
#ifdef CHROMA_FULL
    // reference path: whole interior sampled 3× (≈2× the cost; visually identical — blobs are ≥8u soft)
    ii = vec3(interior(b, p - off, warp).r, interior(b, p, warp).g, interior(b, p + off, warp).b);
#else
    // fast path: the sharp layers (rim iridescence, eyes) are refracted per channel; the soft blob
    // field is shared. Order differs from v6 only in that blobs sit above the inner-rim band.
    vec3 rr = vec3(rimIri(b, p - off).r, rimIri(b, p).g, rimIri(b, p + off).b);
    vec3 sm = blobs(rr, p, warp);
    ii = vec3(eyes(sm, p - off).r, eyes(sm, p).g, eyes(sm, p + off).b);
#endif
    col = mix(b, ii, 1.0 - smoothstep(R - 0.8, R + 0.8, r));   // clip at the pixel, not the tap
  } else {
    col = base(p, r);
  }

  // ---- room light (fixed; not refracted, not moved by gaze) ----
  float px = uView.z;
  // sheen
  float sh = length((p - vec2(100.0, 54.0)) / vec2(56.0, 24.0));
  col = mix(col, vec3(1.0), 0.5 * (1.0 - smoothstep(0.0, 1.25, sh)));
  // crisp thin-film rim: hue from position (pink→lavender→cyan→peach) + film phase across the band
  float hwid = 0.75 * uTune1.y;
  float band = (r - 117.6) / max(hwid, 1e-3);
  float ring = clamp((hwid - abs(r - 117.6)) / px + 0.5, 0.0, 1.0);
  float diag = ((p.x - 20.0) + (p.y - 20.0)) / 400.0;
  float ang  = atan(d.y, d.x) / 6.2831853;
  vec3 film  = iri(diag + 0.04 * sin(ang * 6.2831853 * 2.0) + 0.06 * band);
  col = mix(col, film, ring * 0.9 * uTune1.z);
  // outer iridescent bloom right at the rim (soft, very faint)
  float ob = exp(-pow((r - 118.5) / (2.2 * uTune1.y), 2.0)) * (1.0 - ring);
  col = mix(col, film, ob * 0.18 * uTune1.z);
  // inner white line
  float il = clamp((0.4 - abs(r - 115.8)) / px + 0.5, 0.0, 1.0);
  col = mix(col, vec3(1.0), il * uMode.x);
  // glint (top-left) + small dot
  float gi = uTune2.y;
  float ge = length(rot2(p - vec2(74.0, 44.0), 0.6283185) / vec2(13.0, 5.5));
  col = mix(col, vec3(1.0), 0.92 * gi * (1.0 - smoothstep(0.78, 1.22, ge)));
  float gd = length(p - vec2(92.0, 33.0));
  col = mix(col, vec3(1.0), 0.8 * gi * (1.0 - smoothstep(1.1, 3.1, gd)));

  // dither (kills 8-bit banding in the soft gradients)
  col += (hash(f) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script type="x-shader/x-vertex" id="glass-vert">
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>
<script>/* inlined coats.js (v7 snapshot) */
/* Astrid coats — read-only copy of ColorWay (EInkPalette.swift) desk paper / orb / mark, as [light, dark].
   Plus the default 'glass' preset. palette() derives the shader colours (same logic as v6-svg.html).
   Classic script (no modules) so index.html works from file://. Exposes window.AstridCoats. */
(function(){
  const COATS={
    cream:    {paper:['faf8f3','14130f'],orb:['faf8f3','050505'],mark:['111111','faf8f3']},
    carbon:   {paper:['08090c','08090c'],orb:['05060a','05060a'],mark:['c5ccd6','c5ccd6']},
    sumi:     {paper:['e8f0e4','121310'],orb:['c5cbb8','121310'],mark:['1a1c16','e8f0e4']},
    manila:   {paper:['f4ead0','1c150c'],orb:['e6c48a','1c150c'],mark:['1a2744','f0d8a8']},
    cyanotype:{paper:['d6eef8','0a1822'],orb:['7eb3cc','0a1822'],mark:['003153','b8d4e4']},
    violet:   {paper:['f0e5f9','160a22'],orb:['c9a0e4','08040e'],mark:['2b1548','e4c8f6']},
  };
  const hx=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
  const toHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
  const mix=(a,b,t)=>toHex(hx(a).map((v,i)=>v+(hx(b)[i]-v)*t));
  const lum=h=>{const [r,g,b]=hx(h);return (.2126*r+.7152*g+.0722*b)/255};
  const rgb=h=>hx(h).map(v=>v/255);              // → [0..1] for uniforms

  function palette(name,dark){
    if(name==='glass') return dark
      ? {paper:'#0b0d14',core:'#3d82f2',deep:'#1d4fb8',mid:'#5f86c8',edge:'#1a2236',halo:'#141b2c',eye:'#ffffff',eyeHi:'#ffffff',eyeLo:'#cfe0fb',glow:'#9cc4ff',shadow:'#000000',ink:'#9aa6bd',inner:.25,dark:1}
      : {paper:'#e9e9eb',core:'#3d82f2',deep:'#2a63d6',mid:'#a3c5f8',edge:'#fbf8fe',halo:'#ffffff',eye:'#ffffff',eyeHi:'#ffffff',eyeLo:'#cfe0fb',glow:'#ffffff',shadow:'#2a3d66',ink:'#4a5568',inner:.55,dark:0};
    const c=COATS[name]||COATS.cream,i=dark?1:0,paper='#'+c.paper[i],orb='#'+c.orb[i],mark='#'+c.mark[i];
    const isDark=lum(paper)<.3;
    const core=Math.abs(lum(orb)-lum(paper))<.08 ? mix(orb,mark,isDark?.16:.2) : mix(orb,mark,.1);
    const edge=isDark?mix(paper,mark,.1):mix(paper,'#ffffff',.6);
    const mid=mix(core,edge,.45);
    return {paper,core,deep:mix(core,mark,.22),mid,edge,halo:isDark?mix(paper,mark,.07):'#ffffff',
            eye:mark,eyeHi:mix(mark,isDark?'#ffffff':edge,.3),eyeLo:mix(mark,core,.35),
            glow:isDark?mix(mark,core,.4):'#ffffff',shadow:isDark?'#000000':mark,ink:mix(mark,paper,.3),
            inner:isDark?.2:.55,dark:isDark?1:0};
  }
  /* swatch for the dot picker (same as v6) */
  const swatch=n=>n==='glass'?'radial-gradient(circle at 50% 65%,#3d82f2,#cfe0fb)'
    :'#'+(COATS[n].orb[0]===COATS[n].paper[0]?COATS[n].mark[0]:COATS[n].orb[0]);

  window.AstridCoats={COATS,names:['glass',...Object.keys(COATS)],palette,swatch,mix,rgb,lum};
})();
</script>
<script>/* inlined springs.js (v7 snapshot) */
/* Velocity springs — same integrator as the Swift rig: v=(v+(t-x)*k)*d; x+=v.
   Stepped at a fixed 60 Hz (see index.html) so feel is frame-rate independent.
   Exposes window.AstridSprings. */
(function(){
  const spring=(x,k,d)=>({x,v:0,t:x,k,d});
  const step=s=>{s.v=(s.v+(s.t-s.x)*s.k)*s.d; s.x+=s.v;};
  /* time-scaled step (drift speed slider): k·s², d^s ≈ the same spring run s× faster */
  const stepScaled=(s,speed)=>{
    if(speed<1e-3){s.v=0;return;}
    s.v=(s.v+(s.t-s.x)*s.k*speed*speed)*Math.pow(s.d,speed); s.x+=s.v;
  };
  const snap=(s,x)=>{s.x=s.t=x;s.v=0;};
  window.AstridSprings={spring,step,stepScaled,snap};
})();
</script>
<script>/* inlined face.js (v7 snapshot) */
/* Exact port of AstridFace (Swift): projector(yaw,pitch,roll), stadiumOf, lidFade, eyePath.
   CX=120 CY=120 RR=110, rest eyes lon ±0.2 lat 0.04, stadium w 0.23 h 0.52 (never flatter than a circle).
   eyePts() is the literal 20-seg polygon port (z>0.02 cull) — kept for parity/debug overlay.
   eyeUniforms() hands the same stadium to the shader, which inverts the projector per pixel
   (screen → sphere → un-rotate → lon/lat) and evaluates the stadium analytically there.
   Exposes window.AstridFace. */
(function(){
  const CX=120, CY=120, RR=110, REST={lon:.2, lat:.04, w:.23, h:.52};
  function projector(yaw,pitch,roll){
    const cp=Math.cos(pitch),sp=Math.sin(pitch),cy=Math.cos(yaw),sy=Math.sin(yaw),cr=Math.cos(roll),sr=Math.sin(roll);
    return (lon,lat)=>{
      let x=Math.cos(lat)*Math.sin(lon), y=Math.sin(lat), z=Math.cos(lat)*Math.cos(lon);
      const y1=y*cp-z*sp; z=y*sp+z*cp; y=y1;
      const x2=x*cy+z*sy; z=-x*sy+z*cy; x=x2;
      return {x:CX+RR*(x*cr-y*sr), y:CY-RR*(x*sr+y*cr), z};
    };
  }
  function stadiumOf(e){ const s=Math.max(0,e.s); let w=REST.w*s; const h=REST.h*s; if(h<w) w=h; return [w,h]; }
  function lidFade(e){ const [w,h]=stadiumOf(e); if(w<=0) return 0; return e.lid*h<w ? Math.max(0,e.lid*h/w) : 1; }
  function eyePts(e,xf){
    const n=20,[w,h]=stadiumOf(e),vis=Math.max(w,h*e.lid),hw=w/2,hh=vis/2,r=hw,cap=Math.max(0,hh-r),c=Math.cos(e.rot),sn=Math.sin(e.rot),pts=[];
    const add=(u,v)=>{const u2=u*c-v*sn,v2=u*sn+v*c,p=xf(e.lon+u2,e.lat+v2); if(p.z>.02) pts.push(p);};
    for(let i=0;i<=n;i++){const a=Math.PI-(i/n)*Math.PI; add(hw*Math.cos(a),cap+r*Math.sin(a));}
    for(let i=0;i<=n;i++){const a=-(i/n)*Math.PI; add(hw*Math.cos(a),-cap+r*Math.sin(a));}
    return pts;
  }
  /* shader hand-off: same numbers eyePts() uses (hw, cap) + lidFade, both eyes share size/lid */
  function eyeUniforms(size,lid){
    const e={lon:REST.lon,lat:REST.lat,s:size,rot:0,lid:Math.max(0,lid)};
    const [w,h]=stadiumOf(e), vis=Math.max(w,h*e.lid), hw=w/2, cap=Math.max(0,vis/2-hw);
    return {hw,cap,fade:lidFade(e)};
  }
  window.AstridFace={CX,CY,RR,REST,projector,stadiumOf,lidFade,eyePts,eyeUniforms};
})();
</script>
<script>
(function(){
'use strict';
const {palette,names,swatch,rgb,COATS}=AstridCoats;
const {spring,step,stepScaled,snap}=AstridSprings;
const F=AstridFace, RR=F.RR;
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);

/* ---------------- tuning (debug sliders) ---------------- */
const TUNE_DEF={lag:110,gk:.022,gd:.72,follow:.8,dSpeed:1,dAmt:1,refr:1,rimW:1,rimI:1,frost:1,eyeSoft:1,glint:1};
const SLIDERS=[
  ['lag','glass lag (ms)',0,400,5],
  ['gk','glass spring k',.004,.12,.001],
  ['gd','glass damping',.4,.95,.01],
  ['follow','gaze follow',0,1.6,.01],
  ['dSpeed','drift speed',0,4,.05],
  ['dAmt','drift amount',0,2.5,.05],
  ['refr','refraction',0,3,.05],
  ['rimW','rim thickness',.3,3,.05],
  ['rimI','rim intensity',0,1.5,.05],
  ['frost','frost softness',0,3,.05],
  ['eyeSoft','eye softness',0,3,.05],
  ['glint','glint',0,1.5,.05],
];
let T=Object.assign({},TUNE_DEF);
try{Object.assign(T,JSON.parse(localStorage.getItem('astridTuneV7')||'{}'))}catch(e){}

/* ---------------- WebGL ---------------- */
const cv=$('gl');
const gl=cv.getContext('webgl',{antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:'high-performance'})
      ||cv.getContext('experimental-webgl');
if(!gl){ location.replace('v6-svg.html'+location.search); return; }
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error('Astrid shader compile error:\n'+gl.getShaderInfoLog(s));} return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,$('glass-vert').textContent));
gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,$('glass-frag').textContent));
gl.bindAttribLocation(prog,0,'aPos'); gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){console.error('Astrid link error: '+gl.getProgramInfoLog(prog)); location.replace('v6-svg.html'+location.search); return;}
gl.useProgram(prog);
const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);  // one fullscreen triangle
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
const U={}; ['uView','uPaper','uCore','uDeep','uMid','uEdge','uHalo','uEye','uEyeHi','uEyeLo','uGlow','uShadow','uMode','uRot','uEyeP','uEyeC','uCoreM','uMA','uMB','uMC','uTA','uTB','uTC','uNT','uTune1','uTune2']
  .forEach(n=>U[n]=gl.getUniformLocation(prog,n));

let W=0,H=0,dpr=1,rscale=1;   // rscale: adaptive render scale (only drops if a GPU can't hold ~55 fps)
const adapt=!Q.has('noadapt');
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2)*rscale;
  W=Math.round(innerWidth*dpr); H=Math.round(innerHeight*dpr);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  gl.viewport(0,0,W,H);
  const S=Math.min(.84*Math.min(innerWidth,innerHeight),620)*dpr;     // = .stage size in device px
  gl.uniform3f(U.uView,W/2,H/2,340/S);
}
addEventListener('resize',resize);

/* ---------------- coats ---------------- */
const qCoat=Q.get('coat'), qMode=Q.get('mode');          // test hooks (not persisted)
let state; try{state=JSON.parse(localStorage.getItem('astridCoat')||'')}catch(e){}
if(!state||!names.includes(state.name)) state={name:'glass',dark:false};
if(qCoat&&names.includes(qCoat)) state.name=qCoat;
if(qMode) state.dark=qMode==='dark';
function applyCoat(name,dark,persist){
  const p=palette(name,dark);
  document.documentElement.style.setProperty('--paper',p.paper);
  document.documentElement.style.setProperty('--ink',p.ink);
  const c3=(u,h)=>gl.uniform3fv(U[u],rgb(h));
  c3('uPaper',p.paper);c3('uCore',p.core);c3('uDeep',p.deep);c3('uMid',p.mid);c3('uEdge',p.edge);c3('uHalo',p.halo);
  c3('uEye',p.eye);c3('uEyeHi',p.eyeHi);c3('uEyeLo',p.eyeLo);c3('uGlow',p.glow);c3('uShadow',p.shadow);
  gl.uniform2f(U.uMode,p.inner,p.dark);
  if(persist!==false) localStorage.setItem('astridCoat',JSON.stringify({name,dark}));
  document.querySelectorAll('.coats button[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===name));
  $('modeBtn').textContent=dark?'Dark':'Light';
  state={name,dark};
}
const bar=$('coats');
names.forEach(n=>{
  const b=document.createElement('button'); b.dataset.c=n; b.title=n[0].toUpperCase()+n.slice(1);
  b.style.background=swatch(n);
  b.onclick=e=>{e.stopPropagation();applyCoat(n,state.dark)}; bar.appendChild(b);
});
const mb=document.createElement('button'); mb.id='modeBtn'; mb.className='mode';
mb.onclick=e=>{e.stopPropagation();applyCoat(state.name,!state.dark)}; bar.appendChild(mb);

/* ---------------- pose + glass state ---------------- */
const yaw=spring(0,.07,.74), pitch=spring(0,.07,.74), size=spring(1,.16,.62), lid=spring(1,.45,.5);
const gYaw=spring(0,T.gk,T.gd), gPitch=spring(0,T.gk,T.gd);
const hist=[];   // {t,y,p} pose history for the glass lag
/* blob drift: random targets on very soft springs (no sine) — core, pool, bloom */
const mkDrift=amp=>({amp,x:spring(0,.006,.9),y:spring(0,.006,.9),sx:spring(1,.006,.9),sy:spring(1,.006,.9),r:spring(0,.005,.9),next:0});
const drifts=[mkDrift({t:5,s:.1,r:10}),mkDrift({t:7,s:.16,r:14}),mkDrift({t:11,s:.3,r:40})];
const BOX=354/100;   // v6 drift % → units (drift box = 150% of the 236u orb clip)

/* test hooks: ?yaw=&pitch= freeze the pose (glass snapped); ?still freezes drift + blink + glances */
const forced=Q.has('yaw')||Q.has('pitch'), still=Q.has('still');
if(forced){
  const fy=+Q.get('yaw')||0, fp=+Q.get('pitch')||0;
  [[yaw,fy],[pitch,fp],[gYaw,fy],[gPitch,fp]].forEach(([s,v])=>snap(s,v));
}

let pointerAt=-1e9, simT=0, nextGlance=1800+Math.random()*2600, nextBlink=2800+Math.random()*3400, blinkUntil=-1, doubleAt=-1;
const stage=$('astrid');
addEventListener('pointermove',ev=>{
  if(forced) return;
  const r=stage.getBoundingClientRect();
  const dx=(ev.clientX-(r.left+r.width/2))/(r.width/2), dy=(ev.clientY-(r.top+r.height/2))/(r.height/2);
  yaw.t=Math.max(-1,Math.min(1,dx))*.5; pitch.t=Math.max(-1,Math.min(1,dy))*.34; pointerAt=simT;
});
const blink=()=>{blinkUntil=simT+110;};
stage.addEventListener('click',()=>{size.v+=.09; blink();});

function tick(){            // one fixed 60 Hz step of the whole motion model
  const dt=1000/60; simT+=dt;
  if(!forced&&!still){
    if(simT>=nextGlance){
      if(simT-pointerAt>2500){const home=Math.random()<.45; yaw.t=home?0:(Math.random()*2-1)*.36; pitch.t=home?0:(Math.random()*2-1)*.2;}
      nextGlance=simT+1800+Math.random()*2600;
    }
    if(simT>=nextBlink){ blink(); if(Math.random()<.18) doubleAt=simT+260; nextBlink=simT+2800+Math.random()*3400; }
    if(doubleAt>0&&simT>=doubleAt){ blink(); doubleAt=-1; }
  }
  lid.t=simT<blinkUntil?0:1;
  step(yaw);step(pitch);step(size);step(lid);
  // glass follows the pose from LAG ms ago on a heavier, softer spring (eyes lead)
  hist.push({t:simT,y:yaw.x,p:pitch.x});
  while(hist.length>1&&hist[1].t<=simT-T.lag) hist.shift();
  gYaw.k=gPitch.k=T.gk; gYaw.d=gPitch.d=T.gd;
  if(!forced){ gYaw.t=hist[0].y; gPitch.t=hist[0].p; step(gYaw); step(gPitch); }
  if(!still){
    const sp=T.dSpeed;
    drifts.forEach(d=>{
      if(simT>d.next){
        const A=d.amp, m=T.dAmt;
        d.x.t=(Math.random()*2-1)*A.t*m; d.y.t=(Math.random()*2-1)*A.t*.8*m;
        d.sx.t=1+(Math.random()*2-1)*A.s*m; d.sy.t=1+(Math.random()*2-1)*A.s*m; d.r.t=(Math.random()*2-1)*A.r*m;
        d.next=simT+(2600+Math.random()*3200)/Math.max(.05,sp);
      }
      stepScaled(d.x,sp);stepScaled(d.y,sp);stepScaled(d.sx,sp);stepScaled(d.sy,sp);stepScaled(d.r,sp);
    });
    noiseT+=dt/1000*sp;
  }
}
let noiseT=0; const m2=new Float32Array(4);

function pushUniforms(){
  const cy=Math.cos(yaw.x),sy=Math.sin(yaw.x),cp=Math.cos(pitch.x),sp=Math.sin(pitch.x);
  gl.uniform4f(U.uRot,cy,sy,cp,sp);
  const e=F.eyeUniforms(size.x,lid.x), xf=F.projector(yaw.x,pitch.x,0);
  const cl=xf(-F.REST.lon,F.REST.lat), cr=xf(F.REST.lon,F.REST.lat);
  gl.uniform4f(U.uEyeP,e.hw,e.cap,e.fade,(e.hw+e.cap)*RR+12+4*T.eyeSoft);
  gl.uniform4f(U.uEyeC,cl.x,cl.y,cr.x,cr.y);
  // head turn: INVERTED to the gaze, foreshortened at the side
  const gsy=Math.sin(gYaw.x), gsp=Math.sin(gPitch.x), k=RR*T.follow;
  gl.uniform4f(U.uCoreM,-gsy*k,-gsp*Math.cos(gYaw.x)*k,1-.16*Math.abs(gsy),1-.16*Math.abs(gsp));
  // blob drift → inverse affine per blob: M⁻¹ = S⁻¹·R(−r) (column-major mat2), origin+translate
  const bm=[U.uMA,U.uMB,U.uMC], bt=[U.uTA,U.uTB,U.uTC];
  drifts.forEach((d,i)=>{
    const a=d.r.x*Math.PI/180, c=Math.cos(a), s=Math.sin(a), ix=1/d.sx.x, iy=1/d.sy.x;
    // R(−r) = [c s; −s c] (y-down, CSS clockwise-positive); rows scaled by 1/sx, 1/sy
    m2[0]=c*ix; m2[1]=-s*iy; m2[2]=s*ix; m2[3]=c*iy;
    gl.uniformMatrix2fv(bm[i],false,m2);
    gl.uniform2f(bt[i],120+d.x.x*BOX,144.8+d.y.x*BOX);
  });
  gl.uniform1f(U.uNT,noiseT);
  gl.uniform4f(U.uTune1,T.refr,T.rimW,T.rimI,T.frost);
  gl.uniform4f(U.uTune2,T.eyeSoft,T.glint,6*T.dAmt,0);
}

/* ---------------- single rAF loop (paused when hidden) ---------------- */
let raf=0,last=0,acc=0,fpsN=0,fpsT=0,fps=0,slow=0;
function frame(now){
  raf=requestAnimationFrame(frame);
  if(!last) last=now;
  acc+=Math.min(now-last,100); last=now;
  let n=0; while(acc>=1000/60&&n<6){tick();acc-=1000/60;n++;}
  if(n>=6) acc=0;
  pushUniforms();
  gl.drawArrays(gl.TRIANGLES,0,3);
  fpsN++; if(now-fpsT>=500){
    fps=fpsN*1000/(now-fpsT);fpsN=0;fpsT=now;
    // adaptive quality: 3 slow windows in a row (<52 fps) → drop render scale 15% (floor .5). Never climbs back.
    if(adapt&&!document.hidden){ slow=fps<52?slow+1:0; if(slow>=3&&rscale>.5){rscale=Math.max(.5,rscale*.85);slow=0;resize();} }
    if(fpsEl)fpsEl.textContent=fps.toFixed(0)+' fps · '+W+'×'+H+(rscale<1?' · '+Math.round(rscale*100)+'%':'');
  }
}
function start(){ if(!raf){last=0;fpsN=0;fpsT=performance.now();slow=0;raf=requestAnimationFrame(frame);} }
function stop(){ if(raf){cancelAnimationFrame(raf);raf=0;} }
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());

/* ---------------- debug panel ---------------- */
const dbg=$('dbg'); let fpsEl=null;
function buildDebug(){
  dbg.innerHTML='<h4>ASTRID GLASS <b id="fps">– fps</b></h4>';
  SLIDERS.forEach(([key,label,min,max,st])=>{
    const l=document.createElement('label');
    l.innerHTML=`<span>${label}</span><span></span><input type="range" min="${min}" max="${max}" step="${st}">`;
    const inp=l.querySelector('input'), val=l.querySelectorAll('span')[1];
    const show=()=>{val.textContent=(+T[key]).toFixed(st<.01?3:st<1?2:0);};
    inp.value=T[key]; show();
    inp.oninput=()=>{T[key]=+inp.value; show(); localStorage.setItem('astridTuneV7',JSON.stringify(T));};
    l.dataset.k=key; dbg.appendChild(l);
  });
  const row=document.createElement('div'); row.className='row';
  row.innerHTML='<button id="dReset">Reset</button><button id="dCopy">Copy values</button>';
  dbg.appendChild(row);
  $('dReset').onclick=()=>{T=Object.assign({},TUNE_DEF);localStorage.removeItem('astridTuneV7');buildDebug();};
  $('dCopy').onclick=()=>{
    const txt=JSON.stringify(T,null,2), btn=$('dCopy');
    const ok=()=>{btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy values',1200);};
    (navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(txt):Promise.reject()).then(ok).catch(()=>{
      const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');ok();}catch(e){prompt('Tuning JSON',txt);} ta.remove();});
  };
  fpsEl=$('fps');
  ['pointerdown','click','pointermove'].forEach(t=>dbg.addEventListener(t,e=>e.stopPropagation()));
}
buildDebug();
if(Q.has('debug')) dbg.classList.add('on');
addEventListener('keydown',e=>{ if(e.key==='d'&&!e.metaKey&&!e.ctrlKey&&!(e.target instanceof HTMLInputElement&&e.target.type==='text')) dbg.classList.toggle('on'); });

resize();
applyCoat(state.name,state.dark,!(qCoat||qMode));
start();
/* bench: n synchronous draws with gl.finish() → ms per frame (renderer cost only) */
function bench(n){n=n||60;const was=!!raf;stop();pushUniforms();gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();const t0=performance.now();
  const px=new Uint8Array(4);for(let i=0;i<n;i++){tick();pushUniforms();gl.drawArrays(gl.TRIANGLES,0,3);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);} const ms=(performance.now()-t0)/n; if(was)start(); return ms;}
window.__astrid={bench,get T(){return T},state:()=>state,pose:()=>({yaw:yaw.x,pitch:pitch.x,size:size.x,lid:lid.x,gYaw:gYaw.x,gPitch:gPitch.x}),fps:()=>fps};
})();
</script>
</body>
