<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f1f1f1">
<meta name="description" content="Astrid, a soft frosted-glass orb with a pale blue glow. WebGL.">
<title>Astrid · glass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ccircle cx=%278%27 cy=%278%27 r=%277%27 fill=%27%2376b4f1%27/%3E%3C/svg%3E">
<style>
  :root{--paper:#f1f1f1;--ink:#5a6272}
  html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
  body{display:grid;place-items:center;font:500 12px/1 -apple-system,"Instrument Sans",system-ui,sans-serif;color:var(--ink)}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .stage{position:relative;width:min(84vmin,620px);aspect-ratio:1;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none;border-radius:50%;outline:none}
  .stage:focus-visible{box-shadow:0 0 0 2px var(--ink)}
  .coats{position:fixed;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:10px;align-items:center}
  .coats button{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0;outline-offset:3px}
  .coats button[aria-pressed=true]{outline:1.5px solid var(--ink)}
  .coats .mode{width:auto;height:22px;border-radius:11px;padding:0 10px;background:transparent;color:var(--ink);font:inherit;border-color:currentColor;opacity:.7}
  /* debug panel (?debug or press d) */
  #dbg{position:fixed;top:12px;right:12px;width:236px;padding:10px 12px 12px;border-radius:12px;background:rgba(18,20,28,.82);color:#e8ecf4;
       font:500 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  #dbg.on{display:block}
  #dbg h4{margin:0 0 8px;font-size:11px;display:flex;justify-content:space-between;letter-spacing:.04em}
  #dbg h4 b{color:#8fe3ff;font-weight:600}
  #dbg label{display:grid;grid-template-columns:1fr 44px;gap:2px 6px;margin:5px 0}
  #dbg label span:last-of-type{text-align:right;color:#c4a6ff}
  #dbg input{grid-column:1 / 3;width:100%;margin:0;accent-color:#ff9fe0;height:14px}
  #dbg .row{display:flex;gap:6px;margin-top:9px}
  #dbg button{flex:1;font:inherit;color:#e8ecf4;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:7px;padding:5px 0;cursor:pointer}
  #dbg button:hover{background:rgba(255,255,255,.18)}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="stage" id="astrid" role="button" tabindex="0" aria-label="Astrid. Tap to poke."></div>
<div class="coats" id="coats"></div>

<!-- Glass shader: inlined copy of glass.frag (run `python3 build.py` after editing glass.frag). -->
<script type="x-shader/x-fragment" id="glass-frag">
// Astrid glass · "vibe" (v8): soft, airy, washed-out. One fullscreen fragment pass, one draw call.
// GLSL ES 1.00 (WebGL1/2). Units: AstridFace 240-space. Orb r118 at (120,120); stage framing -50..290.
// Look (matches Henlo's reference): a white frosted form that bleeds into the paper with a Gaussian edge
// (no outline, no glint), a pale luminous blue pool glowing up from the BOTTOM and fading to white haze
// at the top, a faint pink/cyan prism smear only along the soft lower boundary, and big bright white
// stadium "pebble" eyes with a slight RGB split and a faint inner shade.
// Layering (bottom → top):
//   frost(p)  : paper · white bloom into the page · frosted body (Gaussian edge)      [fixed]
//   pool(p)   : drifting blob field (pool, deep floor, bloom) moved by the delayed, inverted head turn,
//               noise warp and random-target drift; inset so a frosted white margin stays around it
//   haze      : white veil, heavier toward the top                                    [fixed]
//   fringe    : pink outside / cyan inside where the pool meets the frosted margin, strongest low
//   eyes      : soft blue-white glow + white pebble fill, sampled 3× (R/G/B) → gentle chromatic edge
// Port note (Metal): uniforms map 1:1 to a constant buffer; plain functions; no textures.
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec3  uView;    // centre x,y (drawing-buffer px, GL origin bottom-left), units per px
uniform vec3  uPaper, uCore, uDeep, uMid, uEdge, uHalo, uEye, uEyeHi, uEyeLo, uGlow;
uniform vec2  uMode;    // x: unused (was inner line), y: dark (0/1)
uniform vec4  uRot;     // eyes: cos yaw, sin yaw, cos pitch, sin pitch
uniform vec4  uEyeP;    // eyes: stadium half-width (rad), cap half-length (rad), lidFade, reject radius (units)
uniform vec4  uEyeC;    // eyes: projected screen centres (L.xy, R.xy) — cheap bounding reject only
uniform vec4  uCoreM;   // glass head-turn: offset xy (units, inverted to gaze), foreshorten scale xy
uniform mat2  uMA, uMB, uMC; // blob drift (floor, pool, bloom): inverse of rotate·scale (precomputed in JS)
uniform vec2  uTA, uTB, uTC; // blob drift: drift origin (120,144.8) + translate (units)
uniform float uNT;      // noise time (advanced by JS × drift speed, wrapped at 28900)
uniform vec4  uTune1;   // eye RGB split, edge softness, haze, pool height
uniform vec4  uTune2;   // eye softness, fringe, noise warp (units), pool strength

const vec2  C  = vec2(120.0, 120.0);
const float R  = 118.0;   // orb
const float RR = 110.0;   // eye sphere (AstridFace projector)
const vec3  PINK = vec3(0.976, 0.620, 0.902);
const vec3  CYAN = vec3(0.560, 0.905, 1.000);

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
// lattice wrapped to 289 cells → the noise is periodic, so JS can wrap uNT (period 28900 s, a common
// multiple of every rate below ×289) and the hash never sees huge arguments after hours on screen.
// Identical to the unwrapped noise for the first 289 lattice cells.
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);
  vec2 j = mod(i + 1.0, 289.0); i = mod(i, 289.0);              // wrap both corners → seamless
  return mix(mix(hash(i), hash(vec2(j.x, i.y)), f.x),
             mix(hash(vec2(i.x, j.y)), hash(j), f.x), f.y);
}
float gauss(float x, float w){ return exp(-(x*x) / (w*w)); }

const vec2 DO = vec2(120.0, 144.8);
vec2 undrift(vec2 q, mat2 m, vec2 ot){ return m * (q - ot) + DO; }

// dark paper wants light added (screen), light paper wants a tint (mix)
vec3 tint(vec3 col, vec3 c, float a){
  return mix(mix(col, c, a), 1.0 - (1.0 - col) * (1.0 - c * a * 0.8), uMode.y);
}

// eyes: screen → sphere (r=RR) → undo yaw, pitch → lon/lat → analytic stadium (AstridFace.eyePath)
vec3 eyes(vec3 col, vec2 p){
  vec2 el = p - uEyeC.xy, er = p - uEyeC.zw;
  if (min(dot(el, el), dot(er, er)) > uEyeP.w * uEyeP.w) return col;   // far from both eyes
  vec2 s = (p - C) / RR; s.y = -s.y;
  float rr = dot(s, s);
  if (rr >= 1.0 || uEyeP.z <= 0.0) return col;
  float Z  = sqrt(1.0 - rr);
  float x  = s.x*uRot.x - Z*uRot.y;
  float z1 = s.x*uRot.y + Z*uRot.x;
  float y  = s.y*uRot.z + z1*uRot.w;
  float z  = -s.y*uRot.w + z1*uRot.z;
  float lon = atan(x, z), lat = asin(clamp(y, -1.0, 1.0));
  float u = lon - (lon < 0.0 ? -0.2 : 0.2), v = lat - 0.04;
  float hw = uEyeP.x, cap = uEyeP.y;
  float d  = length(vec2(u, v - clamp(v, -cap, cap))) - hw;   // radians
  float ds = d * RR * mix(Z, 1.0, 0.5);                       // ≈ screen units (foreshortened)
  float w  = 0.8 * uTune2.x + 0.4;
  float vis = uEyeP.z * smoothstep(0.02, 0.08, Z);            // lidFade · z>0.02 cull
  // soft luminous glow: the pebble lights the haze around it a little
  float glow = 0.26 * gauss(max(ds, 0.0), 4.0 + 3.0*w);
  col = tint(col, uGlow, glow * vis);
  // pool-coloured aura hugging the outline: keeps the pebbles reading when a glance carries them
  // out over the white haze (on the blue pool it is nearly invisible)
  col = mix(col, mix(uCore, uMid, 0.3), 0.42 * gauss(max(ds, 0.0) - 1.5, 3.5 + 2.5*w) * vis * (1.0 - uMode.y*0.4));
  // pebble fill: bright top-right → white → faint shade lower-left, plus a soft inner edge shade
  float uu = clamp(u / max(hw, 1e-4) * 0.5 + 0.5, 0.0, 1.0);
  float vv = clamp(0.5 - v / (2.0 * (cap + hw) + 1e-4), 0.0, 1.0);
  float t  = clamp((0.45*(1.0 - uu) + vv) / 1.2, 0.0, 1.0);
  vec3 ec  = t < 0.5 ? mix(uEyeHi, uEye, t / 0.5) : mix(uEye, uEyeLo, 0.55 * smoothstep(0.55, 1.0, t));
  float rimShade = smoothstep(-hw * RR * 0.7, 0.0, ds) * smoothstep(0.3, 0.9, t);
  ec = mix(ec, uEyeLo, 0.4 * rimShade);
  float fill = 1.0 - smoothstep(-w, w, ds);
  return mix(col, ec, fill * vis);
}

void main(){
  vec2 f = gl_FragCoord.xy;
  vec2 p = C + vec2(f.x - uView.x, uView.y - f.y) * uView.z;
  vec2 d = p - C; float r = length(d * 0.01) * 100.0;   // scaled: no fp16 overflow far off-orb (mediump)
  float es = uTune1.y;
  float low = (p.y - C.y) / R;                 // −1 top … +1 bottom

  // ---- frost: paper · white bloom · frosted body (all fixed; Gaussian edge, no outline) ----
  vec3 col = uPaper;
  float out_ = max(r - R + 4.0, 0.0);
  col = mix(col, uHalo, 0.38 * gauss(out_, 10.0 * es + 3.0));
  float body = 1.0 - smoothstep(R - 6.0*es - 1.0, R + 5.0*es + 1.0, r);
  col = mix(col, uEdge, body);

  if (r < R + 12.0) {
    // ---- pool: head-turn (inverted, delayed) → noise warp → random-target drift ----
    vec2 np = p * 0.016;
    vec2 warp = vec2(vnoise(np + vec2(uNT*0.11, uNT*0.05)) + 0.5*vnoise(np*2.1 + vec2(-uNT*0.07, uNT*0.09) + 3.7),
                     vnoise(np + vec2(7.1 - uNT*0.06, 2.3 + uNT*0.10)) + 0.5*vnoise(np*2.1 + vec2(uNT*0.08, -uNT*0.06) + 9.2)) - 0.75;
    warp *= uTune2.z;
    vec2 q = (p - C - uCoreM.xy) / uCoreM.zw + C + warp;
    float ph = uTune1.w;
    // main pool: a broad dome rising from below the orb
    vec2 qb = undrift(q, uMB, uTB);
    float dP = length((qb - vec2(120.0, 222.0)) / vec2(136.0, 196.0 * ph));
    float aP = 1.0 - smoothstep(0.48, 0.98, dP);
    vec3  cP = mix(uMid, uCore, smoothstep(0.95, 0.55, dP));
    // deeper floor (bottom, slightly off-centre)
    vec2 qa = undrift(q, uMA, uTA);
    float dA = length((qa - vec2(108.0, 186.0)) / vec2(82.0, 56.0 * mix(1.0, ph, 0.5)));
    float aA = 0.55 * (1.0 - smoothstep(0.1, 1.0, dA));
    // pale bloom that morphs through the upper pool
    vec2 qc = undrift(q, uMC, uTC);
    float dC = length((qc - vec2(140.0, 128.0)) / vec2(70.0, 52.0));
    float aC = 0.45 * (1.0 - smoothstep(0.0, 1.0, dC));
    // frosted margin: the pool never reaches the rim (sides wide, bottom thinner)
    float inset = mix(30.0, 14.0, smoothstep(0.2, 0.95, low)) * es + 4.0;
    float m = 1.0 - smoothstep(R - inset - 10.0*es, R - inset + 6.0*es + 2.0, r);
    float pa = clamp(aP * uTune2.w, 0.0, 1.0);
    vec3 pool = mix(uEdge, cP, pa);
    pool = mix(pool, uDeep, aA * aP * uTune2.w);
    pool = mix(pool, mix(uMid, uEdge, 0.35), aC * aP);
    // backlit floor: just above the bottom margin the pool goes lighter + cyan (luminous, not muddy)
    float lift = smoothstep(0.55, 0.95, low) * m;
    pool = mix(pool, mix(uMid, CYAN, 0.45), 0.55 * lift * pa * (1.0 - uMode.y*0.5));
    col = mix(col, pool, m * body);

    // ---- haze: white veil, heavier toward the top (fixed) ----
    float hz = uTune1.z * (0.06 + 0.70 * smoothstep(-0.38, -0.98, low));
    col = mix(col, uEdge, clamp(hz, 0.0, 1.0) * body);

    // ---- fringe: blurred prism smear where the blue meets the frosted margin, strongest low ----
    float fr = uTune2.y * smoothstep(-0.35, 0.85, low) * (0.25 + 0.75 * clamp(pa * 1.6, 0.0, 1.0));
    float rb = R - inset;                                       // pool boundary radius
    float fw = 5.0 * es + 2.5;
    col = tint(col, PINK, 0.44 * fr * gauss(r - (rb + 2.0), fw));
    col = tint(col, CYAN, 0.30 * fr * gauss(r - (rb - 7.0), fw));
    // faint outer smear on the paper just below the form's soft bottom edge
    col = tint(col, PINK, 0.07 * uTune2.y * smoothstep(0.5, 1.0, low) * gauss(r - (R + 2.0), 4.0 + 3.0*es));

    // ---- eyes: 3 taps (R/G/B) at slightly different positions → gentle chromatic edge ----
    vec2 dir = r > 1e-3 ? d / r : vec2(0.0);
    vec2 off = (dir * (0.8 + 2.2 * min(r / R, 1.0)) + vec2(1.5, 0.0)) * uTune1.x * mix(1.0, 0.7, uMode.y);
    col = vec3(eyes(col, p + off).r, eyes(col, p).g, eyes(col, p - off).b);
  }

  col += (hash(mod(f, 64.0)) - 0.5) / 255.0;   // dither (kills 8-bit banding); mod keeps mediump finite
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script type="x-shader/x-vertex" id="glass-vert">
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script src="springs.js"></script>
<script src="face.js"></script>
<script>
(function(){
'use strict';
const {palette,names,swatch,rgb}=AstridCoats;
const {spring,step,stepScaled,snap,save,at}=AstridSprings;
const F=AstridFace, RR=F.RR;
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const STEP=1000/60;                 // the whole motion model runs at a fixed 60 Hz (rig feel), any display rate
const NT_WRAP=28900;                // noise time period (see glass.frag vnoise): wrap is seamless

/* storage that never throws (private mode, blocked storage, sandboxed iframes) */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
             del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------------- tuning (debug sliders) ---------------- */
const TUNE_KEY='astridTuneVibe';
const TUNE_DEF={lag:110,gk:.022,gd:.72,follow:.8,dSpeed:1,dAmt:1,edge:1,haze:1,poolH:1,poolI:1,fringe:1,split:1,eyeScale:1.3,eyeSoft:1};
const SLIDERS=[
  ['lag','glass lag (ms)',0,400,5],
  ['gk','glass spring k',.004,.12,.001],
  ['gd','glass damping',.4,.95,.01],
  ['follow','gaze follow',0,1.6,.01],
  ['dSpeed','drift speed',0,4,.05],
  ['dAmt','drift amount',0,2.5,.05],
  ['edge','edge softness',0,3,.05],
  ['haze','haze amount',0,2,.05],
  ['poolH','bottom-pool height',.4,1.8,.02],
  ['poolI','pool strength',0,1.6,.05],
  ['fringe','fringe strength',0,3,.05],
  ['split','eye RGB split',0,3,.05],
  ['eyeScale','eye size',.8,1.6,.01],
  ['eyeSoft','eye softness',0,3,.05],
];
function loadTune(){            // only known keys, finite, clamped to the slider range
  const t=Object.assign({},TUNE_DEF); let s=null;
  try{s=JSON.parse(store.get(TUNE_KEY)||'null')}catch(e){}
  if(s&&typeof s==='object') SLIDERS.forEach(([k,,min,max])=>{const v=+s[k]; if(k in s&&Number.isFinite(v)) t[k]=Math.min(max,Math.max(min,v));});
  return t;
}
let T=loadTune();

/* ---------------- WebGL ---------------- */
const cv=$('gl'), stage=$('astrid');
const GL_OPTS={antialias:false,alpha:false,depth:false,stencil:false,premultipliedAlpha:false,powerPreference:'high-performance'};
const toFallback=why=>{console.warn('Astrid: '+why+', using the SVG fallback'); location.replace('v6-svg.html'+location.search);};
const gl=cv.getContext('webgl',GL_OPTS)||cv.getContext('experimental-webgl',GL_OPTS);
if(!gl){ toFallback('WebGL unavailable'); return; }
const UNIFORMS=['uView','uPaper','uCore','uDeep','uMid','uEdge','uHalo','uEye','uEyeHi','uEyeLo','uGlow','uMode','uRot','uEyeP','uEyeC','uCoreM','uMA','uMB','uMC','uTA','uTB','uTC','uNT','uTune1','uTune2'];
let U={}, lost=false;
function initGL(){              // (re)build everything GPU-side; also used after a context restore
  const sh=(type,id)=>{const s=gl.createShader(type);gl.shaderSource(s,$(id).textContent);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)&&!gl.isContextLost()) console.error('Astrid shader compile error ('+id+'):\n'+gl.getShaderInfoLog(s));
    return s;};
  const prog=gl.createProgram(), vs=sh(gl.VERTEX_SHADER,'glass-vert'), fs=sh(gl.FRAGMENT_SHADER,'glass-frag');
  gl.attachShader(prog,vs); gl.attachShader(prog,fs);
  gl.bindAttribLocation(prog,0,'aPos'); gl.linkProgram(prog);
  gl.deleteShader(vs); gl.deleteShader(fs);                 // flagged; freed with the program
  if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){
    if(!gl.isContextLost()) console.error('Astrid link error: '+gl.getProgramInfoLog(prog));
    return false;
  }
  gl.useProgram(prog);
  const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);   // one fullscreen triangle
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  U={}; UNIFORMS.forEach(n=>U[n]=gl.getUniformLocation(prog,n));
  return true;
}
if(!initGL()&&!gl.isContextLost()){ toFallback('shader failed to build'); return; }

/* ---------------- size / DPR ---------------- */
let W=0,H=0,dpr=1,rscale=1, needResize=true;   // rscale: adaptive render scale
function resize(){
  needResize=false;
  if(lost) return;
  const cr=cv.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  dpr=Math.min(window.devicePixelRatio||1,2)*rscale;
  W=Math.max(1,Math.round(cr.width*dpr)); H=Math.max(1,Math.round(cr.height*dpr));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  gl.viewport(0,0,W,H);
  // map 340 units to the CSS stage exactly, centred on the stage (pointer hitbox == drawn orb)
  const sx=W/Math.max(1,cr.width), sy=H/Math.max(1,cr.height), S=Math.max(1,sr.width*sx);
  gl.uniform3f(U.uView,(sr.left-cr.left+sr.width/2)*sx,H-(sr.top-cr.top+sr.height/2)*sy,340/S);
}
addEventListener('resize',()=>{needResize=true;});
if(window.ResizeObserver) new ResizeObserver(()=>{needResize=true;}).observe(stage);
(function watchDpr(){            // moving to a screen with a different DPR doesn't always fire resize
  if(!window.matchMedia) return;
  const mq=matchMedia(`(resolution: ${window.devicePixelRatio||1}dppx)`);
  const on=()=>{needResize=true; mq.removeEventListener?mq.removeEventListener('change',on):mq.removeListener(on); watchDpr();};
  mq.addEventListener?mq.addEventListener('change',on):mq.addListener(on);
})();

/* ---------------- coats ---------------- */
const qCoat=Q.get('coat'), qMode=Q.get('mode');          // test hooks (not persisted)
let state=null; try{state=JSON.parse(store.get('astridCoat')||'null')}catch(e){}
if(!state||typeof state!=='object'||!names.includes(state.name)) state={name:'glass',dark:false};
state={name:state.name,dark:!!state.dark};
if(qCoat&&names.includes(qCoat)) state.name=qCoat;
if(qMode) state.dark=qMode==='dark';
const themeMeta=document.querySelector('meta[name=theme-color]');
function applyCoat(name,dark,persist){
  const p=palette(name,dark);
  document.documentElement.style.setProperty('--paper',p.paper);
  document.documentElement.style.setProperty('--ink',p.ink);
  if(themeMeta) themeMeta.content=p.paper;
  if(!lost){
    const c3=(u,h)=>gl.uniform3fv(U[u],rgb(h));
    c3('uPaper',p.paper);c3('uCore',p.core);c3('uDeep',p.deep);c3('uMid',p.mid);c3('uEdge',p.edge);c3('uHalo',p.halo);
    c3('uEye',p.eye);c3('uEyeHi',p.eyeHi);c3('uEyeLo',p.eyeLo);c3('uGlow',p.glow);
    gl.uniform2f(U.uMode,p.inner,p.dark);
  }
  if(persist!==false) store.set('astridCoat',JSON.stringify({name,dark}));
  document.querySelectorAll('.coats button[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===name));
  $('modeBtn').textContent=dark?'Dark':'Light';
  state={name,dark};
}
const bar=$('coats');
names.forEach(n=>{
  const b=document.createElement('button'); b.type='button'; b.dataset.c=n;
  b.title=b.ariaLabel=n[0].toUpperCase()+n.slice(1)+' coat'; b.setAttribute('aria-label',b.title);
  b.style.background=swatch(n);
  b.onclick=e=>{e.stopPropagation();applyCoat(n,state.dark)}; bar.appendChild(b);
});
const mb=document.createElement('button'); mb.type='button'; mb.id='modeBtn'; mb.className='mode'; mb.title='Toggle light / dark';
mb.onclick=e=>{e.stopPropagation();applyCoat(state.name,!state.dark)}; bar.appendChild(mb);
bar.addEventListener('pointerdown',e=>e.stopPropagation());

/* ---------------- pose + glass state ---------------- */
const yaw=spring(0,.07,.74), pitch=spring(0,.07,.74), size=spring(1,.16,.62), lid=spring(1,.45,.5);
const gYaw=spring(0,T.gk,T.gd), gPitch=spring(0,T.gk,T.gd);
const hist=[];   // {t,y,p} pose history for the glass lag (bounded by T.lag)
/* blob drift: random targets on very soft springs (no sine) — floor, pool, bloom */
const mkDrift=amp=>({amp,x:spring(0,.006,.9),y:spring(0,.006,.9),sx:spring(1,.006,.9),sy:spring(1,.006,.9),r:spring(0,.005,.9),next:0});
const drifts=[mkDrift({t:5,s:.1,r:10}),mkDrift({t:7,s:.16,r:14}),mkDrift({t:11,s:.3,r:40})];
const BOX=354/100;   // v6 drift % → units (drift box = 150% of the 236u orb clip)
const ALL=[yaw,pitch,size,lid,gYaw,gPitch]; drifts.forEach(d=>ALL.push(d.x,d.y,d.sx,d.sy,d.r));

/* test hooks: ?yaw=&pitch= freeze the pose (glass snapped); ?still freezes drift + blink + glances */
const forced=Q.has('yaw')||Q.has('pitch'), still=Q.has('still');
if(forced){
  const fy=+Q.get('yaw')||0, fp=+Q.get('pitch')||0;
  [[yaw,fy],[pitch,fp],[gYaw,fy],[gPitch,fp]].forEach(([s,v])=>snap(s,v));
}
/* reduced motion: no idle glances, slower glass drift (pointer follow, blinks and taps stay) */
const rmq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
let RM=!!(rmq&&rmq.matches);
if(rmq) (rmq.addEventListener?rmq.addEventListener('change',e=>RM=e.matches):rmq.addListener(e=>RM=e.matches));

let pointerAt=-1e9, simT=0, nextGlance=1800+Math.random()*2600, nextBlink=2800+Math.random()*3400, blinkUntil=-1, doubleAt=-1;
let noiseT=0, prevNT=0;
function aim(ev){
  if(forced) return;
  const r=stage.getBoundingClientRect();
  const dx=(ev.clientX-(r.left+r.width/2))/(r.width/2), dy=(ev.clientY-(r.top+r.height/2))/(r.height/2);
  yaw.t=Math.max(-1,Math.min(1,dx))*.5; pitch.t=Math.max(-1,Math.min(1,dy))*.34; pointerAt=simT;
}
addEventListener('pointermove',aim,{passive:true});
addEventListener('pointerdown',aim,{passive:true});          // touch has no hover: a touch aims too
const lookHome=()=>{ if(!forced){yaw.t=0;pitch.t=0;} };       // pointer left the window → eyes come home
document.addEventListener('pointerout',e=>{ if(!e.relatedTarget&&e.pointerType==='mouse') lookHome(); },{passive:true});
addEventListener('blur',lookHome);
const blink=()=>{blinkUntil=simT+110;};
const tap=()=>{size.v+=.09; blink();};
stage.addEventListener('click',tap);
stage.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();tap();} });

function tick(){            // one fixed 60 Hz step of the whole motion model
  ALL.forEach(save); prevNT=noiseT;
  const dt=STEP; simT+=dt;
  if(!forced&&!still){
    if(simT>=nextGlance){
      if(!RM&&simT-pointerAt>2500){const home=Math.random()<.45; yaw.t=home?0:(Math.random()*2-1)*.36; pitch.t=home?0:(Math.random()*2-1)*.2;}
      nextGlance=simT+1800+Math.random()*2600;
    }
    if(simT>=nextBlink){ blink(); if(Math.random()<.18) doubleAt=simT+260; nextBlink=simT+2800+Math.random()*3400; }
    if(doubleAt>0&&simT>=doubleAt){ blink(); doubleAt=-1; }
  }
  lid.t=simT<blinkUntil?0:1;
  step(yaw);step(pitch);step(size);step(lid);
  // glass follows the pose from LAG ms ago on a heavier, softer spring (eyes lead)
  hist.push({t:simT,y:yaw.x,p:pitch.x});
  while(hist.length>1&&hist[1].t<=simT-T.lag) hist.shift();
  gYaw.k=gPitch.k=T.gk; gYaw.d=gPitch.d=T.gd;
  if(!forced){ gYaw.t=hist[0].y; gPitch.t=hist[0].p; step(gYaw); step(gPitch); }
  if(!still){
    const sp=T.dSpeed*(RM?.3:1);
    drifts.forEach(d=>{
      if(simT>d.next){
        const A=d.amp, m=T.dAmt;
        d.x.t=(Math.random()*2-1)*A.t*m; d.y.t=(Math.random()*2-1)*A.t*.8*m;
        d.sx.t=1+(Math.random()*2-1)*A.s*m; d.sy.t=1+(Math.random()*2-1)*A.s*m; d.r.t=(Math.random()*2-1)*A.r*m;
        d.next=simT+(2600+Math.random()*3200)/Math.max(.05,sp);
      }
      stepScaled(d.x,sp);stepScaled(d.y,sp);stepScaled(d.sx,sp);stepScaled(d.sy,sp);stepScaled(d.r,sp);
    });
    noiseT+=dt/1000*sp;
    if(noiseT>=NT_WRAP){noiseT-=NT_WRAP; prevNT-=NT_WRAP;}   // seamless (periodic noise)
  }
}
const m2=new Float32Array(4);

/* a ∈ [0,1): how far into the next 60 Hz step this frame is → interpolated, so 120 Hz is smooth */
function pushUniforms(a){
  const Y=at(yaw,a), P=at(pitch,a), gy=at(gYaw,a), gp=at(gPitch,a);
  const cy=Math.cos(Y),sy=Math.sin(Y),cp=Math.cos(P),sp=Math.sin(P);
  gl.uniform4f(U.uRot,cy,sy,cp,sp);
  const e=F.eyeUniforms(at(size,a)*T.eyeScale,at(lid,a)), xf=F.projector(Y,P,0);   // stadiumOf keeps it ≥ a circle
  const cl=xf(-F.REST.lon,F.REST.lat), cr=xf(F.REST.lon,F.REST.lat);
  gl.uniform4f(U.uEyeP,e.hw,e.cap,e.fade,(e.hw+e.cap)*RR+24+8*T.eyeSoft+4*T.split);
  gl.uniform4f(U.uEyeC,cl.x,cl.y,cr.x,cr.y);
  // head turn: INVERTED to the gaze, foreshortened at the side
  const gsy=Math.sin(gy), gsp=Math.sin(gp), k=RR*T.follow;
  gl.uniform4f(U.uCoreM,-gsy*k,-gsp*Math.cos(gy)*k,1-.16*Math.abs(gsy),1-.16*Math.abs(gsp));
  // blob drift → inverse affine per blob: M⁻¹ = S⁻¹·R(−r) (column-major mat2), origin+translate
  const bm=[U.uMA,U.uMB,U.uMC], bt=[U.uTA,U.uTB,U.uTC];
  drifts.forEach((d,i)=>{
    const ang=at(d.r,a)*Math.PI/180, c=Math.cos(ang), s=Math.sin(ang), ix=1/at(d.sx,a), iy=1/at(d.sy,a);
    m2[0]=c*ix; m2[1]=-s*iy; m2[2]=s*ix; m2[3]=c*iy;
    gl.uniformMatrix2fv(bm[i],false,m2);
    gl.uniform2f(bt[i],120+at(d.x,a)*BOX,144.8+at(d.y,a)*BOX);
  });
  gl.uniform1f(U.uNT,prevNT+(noiseT-prevNT)*a);
  gl.uniform4f(U.uTune1,T.split,T.edge,T.haze,T.poolH);
  gl.uniform4f(U.uTune2,T.eyeSoft,T.fringe,6*T.dAmt,T.poolI);
}

/* ---------------- single rAF loop (paused when hidden or context lost) ---------------- */
let raf=0,last=0,acc=0,fpsN=0,fpsT=0,fps=0;
/* adaptive quality: 3 slow windows (<52 fps) → try 85% resolution. If that doesn't buy ≥8% fps the
   limit is vsync (30 Hz screens, iOS Low Power) or CPU, so undo it and stop adapting. Never climbs back. */
const adapt=!Q.has('noadapt'); let slow=0, probe=null, adaptOff=!adapt, windows=0;
function adaptStep(){
  if(adaptOff||document.hidden||++windows<4) return;        // skip the first ~1.5 s (compile, page jank)
  if(probe){
    probe.sum+=fps; if(++probe.n<3) return;
    if(probe.sum/3<probe.fps*1.08){ rscale=probe.scale; adaptOff=true; needResize=true; }
    probe=null; return;
  }
  slow=fps<52?slow+1:0;
  if(slow>=3&&rscale>.5){ probe={fps,scale:rscale,sum:0,n:0}; rscale=Math.max(.5,rscale*.85); slow=0; needResize=true; }
}
function frame(now){
  raf=requestAnimationFrame(frame);
  if(lost) return;
  if(needResize) resize();
  if(!last) last=now;
  acc+=Math.min(now-last,100); last=now;
  let n=0; while(acc>=STEP&&n<6){tick();acc-=STEP;n++;}
  if(acc>=STEP) acc=0;                                       // fell far behind: drop, don't spiral
  pushUniforms(acc/STEP);
  gl.drawArrays(gl.TRIANGLES,0,3);
  fpsN++; if(now-fpsT>=500){
    fps=fpsN*1000/(now-fpsT);fpsN=0;fpsT=now; adaptStep();
    if(fpsEl&&dbg.classList.contains('on')) fpsEl.textContent=fps.toFixed(0)+' fps · '+W+'×'+H+(rscale<1?' · '+Math.round(rscale*100)+'%':'');
  }
}
function start(){ if(!raf&&!lost&&!document.hidden){last=0;acc=0;fpsN=0;fpsT=performance.now();slow=0;probe=null;raf=requestAnimationFrame(frame);} }
function stop(){ if(raf){cancelAnimationFrame(raf);raf=0;} }
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
cv.addEventListener('webglcontextlost',e=>{ e.preventDefault(); lost=true; stop(); },false);
cv.addEventListener('webglcontextrestored',()=>{
  lost=false;
  if(!initGL()){ toFallback('WebGL context could not be restored'); return; }
  resize(); applyCoat(state.name,state.dark,false); start();
},false);

/* ---------------- debug panel ---------------- */
const dbg=$('dbg'); let fpsEl=null;
function buildDebug(){
  dbg.innerHTML='<h4>ASTRID · VIBE <b id="fps">– fps</b></h4>';
  SLIDERS.forEach(([key,label,min,max,st])=>{
    const l=document.createElement('label');
    l.innerHTML=`<span>${label}</span><span></span><input type="range" min="${min}" max="${max}" step="${st}">`;
    const inp=l.querySelector('input'), val=l.querySelectorAll('span')[1];
    const show=()=>{val.textContent=(+T[key]).toFixed(st<.01?3:st<1?2:0);};
    inp.value=T[key]; show();
    inp.oninput=()=>{T[key]=+inp.value; show(); store.set(TUNE_KEY,JSON.stringify(T));};
    l.dataset.k=key; dbg.appendChild(l);
  });
  const row=document.createElement('div'); row.className='row';
  row.innerHTML='<button type="button" id="dReset">Reset</button><button type="button" id="dCopy">Copy values</button>';
  dbg.appendChild(row);
  $('dReset').onclick=()=>{T=Object.assign({},TUNE_DEF);store.del(TUNE_KEY);buildDebug();};
  $('dCopy').onclick=()=>{
    const txt=JSON.stringify(T,null,2), btn=$('dCopy');
    const ok=()=>{btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy values',1200);};
    const legacy=()=>{
      const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0';
      document.body.appendChild(ta);ta.select();let done=false;
      try{done=document.execCommand('copy');}catch(e){}
      ta.remove(); done?ok():prompt('Tuning JSON',txt);
    };
    if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(ok,legacy); else legacy();
  };
  fpsEl=$('fps');
}
['pointerdown','click','pointermove'].forEach(t=>dbg.addEventListener(t,e=>e.stopPropagation()));
buildDebug();
if(Q.has('debug')) dbg.classList.add('on');
addEventListener('keydown',e=>{
  if(e.key!=='d'||e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target; if(t&&(t.isContentEditable||t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type!=='range'))) return;
  dbg.classList.toggle('on');
});

resize();
applyCoat(state.name,state.dark,!(qCoat||qMode));
start();
/* bench: n synchronous draws with a 1-px readback → ms per frame (renderer cost only) */
function bench(n){n=n||60;const was=!!raf;stop();pushUniforms(0);gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();const t0=performance.now();
  const px=new Uint8Array(4);for(let i=0;i<n;i++){tick();pushUniforms(0);gl.drawArrays(gl.TRIANGLES,0,3);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);} const ms=(performance.now()-t0)/n; if(was)start(); return ms;}
window.__astrid={bench,get T(){return T},state:()=>state,pose:()=>({yaw:yaw.x,pitch:pitch.x,size:size.x,lid:lid.x,gYaw:gYaw.x,gPitch:gPitch.x}),fps:()=>fps,rscale:()=>rscale};
})();
</script>
</body>
</html>
